# Global Gradle settings
# Enable build cache
org.gradle.caching=true

# Enable configuration cache (experimental but stable for most builds)
org.gradle.configuration-cache=true
# Log configuration cache problems as warnings to ease adoption
org.gradle.configuration-cache.problems=warn

# Parallel task execution for multi-project builds
org.gradle.parallel=true

# Keep the daemon running for faster subsequent builds
org.gradle.daemon=true

org.gradle.vfs.watch=true
